spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_dev
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

upload.dir=uploads/photos

 # Em produção, defina SECURITY_JWT_SECRET nas variáveis de ambiente.
 # O valor padrão é exclusivo para desenvolvimento local.
security.jwt.secret=${SECURITY_JWT_SECRET:desenvolvimento-chave-jwt-32-caracteres}
security.jwt.expiration-seconds=7200

